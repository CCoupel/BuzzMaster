# Couleur d'équipe — la couleur de l'équipe créditée, fixe, le temps de l'attribution.
# Pensé pour le groupe animateur (un seul groupe), utilisable aussi en salle.
id: couleur-equipe
name: Couleur de l'équipe
description: >
  La couleur de l'équipe qui vient de marquer, fixe, le temps de l'attribution
  des points. Pensé pour le groupe animateur.
version: 1
moments: [score]
target: all
min_groups: 1
duration_ms: 4800     # durée de l'impulsion SCORE (lighting.ScorePulseDuration)

looks:
  equipe: { color: team, intensity: 100 }

pattern:
  type: uniform
  phases:
    - { look: equipe, ms: 1000 }
