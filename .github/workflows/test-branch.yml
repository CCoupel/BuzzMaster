name: Test (milestone branches)

# Same steps as the "Test (race)" job of release.yml, without any publication.
on:
  push:
    branches:
      - 'milestone/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'

jobs:
  testing:
    name: 🧪 Test (race)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server-go/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: server-go/web
        run: npm ci

      - name: Build frontend
        working-directory: server-go/web
        run: npm run build

      # server-go/web/embed.go declares `//go:embed all:dist` (see release.yml, #153)
      - name: Copy dist for embedding
        run: |
          rm -rf server-go/cmd/server/dist
          cp -r server-go/web/dist server-go/cmd/server/dist

      - name: Run tests with race detector
        working-directory: server-go
        env:
          CGO_ENABLED: 1
        run: go test -race -timeout=20m ./...

      - name: Lint (go vet)
        working-directory: server-go
        run: go vet ./...

      - name: Audit (govulncheck)
        working-directory: server-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
