name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  # ============================================
  # STAGE 0: Testing (unit tests + race detector)
  # ============================================
  testing:
    name: 🧪 Test (race)
    runs-on: ubuntu-latest
    needs: checking

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server-go/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: server-go/web
        run: npm ci

      - name: Build frontend
        working-directory: server-go/web
        run: npm run build

      # server-go/web/embed.go declares `//go:embed all:dist`, and
      # cmd/server/dist/ is gitignored — on a clean checkout the directory
      # doesn't exist, so `go build`/`go test` fail at compile time before a
      # single test runs (#153). Mirrors the compiling job's sequence above
      # exactly rather than a stub dist/, since internal/server/
      # fonts_route_test.go exercises the real embedded fonts.
      - name: Copy dist for embedding
        run: |
          rm -rf server-go/cmd/server/dist
          cp -r server-go/web/dist server-go/cmd/server/dist

      - name: Run tests with race detector
        working-directory: server-go
        env:
          CGO_ENABLED: 1
        run: go test -race -timeout=20m ./...

      # commands.lint (project-config.json)
      - name: Lint (go vet)
        working-directory: server-go
        run: go vet ./...

      # commands.audit (project-config.json) — blocking: a known vulnerability
      # in a reachable dependency/stdlib fails the release before any publish.
      - name: Audit (govulncheck)
        working-directory: server-go
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ============================================
  # STAGE 1: Checking (extract version from tag + coherence check)
  # Runs first: every other job depends on it.
  # ============================================
  checking:
    name: 🔍 Checking
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "=========================================="
          echo "✅ Release version: v$VERSION"
          echo "=========================================="

      # The CI NEVER rewrites a version file: it only verifies that every versioned
      # file is consistent with the tag. Any mismatch fails the release; all
      # mismatches are listed before exiting. Fix = bump the files, commit,
      # then re-create the tag.
      - name: Check tag matches all versioned files
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag 'v$VERSION' is not a valid SemVer tag (expected vX.Y.Z)"
            exit 1
          fi

          FAIL=0
          REPORT=""

          check() { # $1=file  $2=location label  $3=found value
            if [ -z "$3" ] || [ "$3" = "null" ]; then
              echo "::error file=$1::$2: no version found (expected $VERSION)"
              REPORT="$REPORT\n  - $1 [$2]: not found (expected $VERSION)"
              FAIL=1
            elif [ "$3" != "$VERSION" ]; then
              echo "::error file=$1::$2 declares $3, tag is v$VERSION"
              REPORT="$REPORT\n  - $1 [$2]: $3 (expected $VERSION)"
              FAIL=1
            else
              echo "OK $1 [$2] = $3"
            fi
          }

          # JSON files
          for f in server-go/config.json server-go/web/package.json server-go/internal/server/config.json; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::File missing (expected version $VERSION)"
              REPORT="$REPORT\n  - $f: file missing"
              FAIL=1
              continue
            fi
            check "$f" ".version" "$(jq -r '.version' "$f")"
          done

          # Firmware: platformio.ini (VERSION and FIRMWARE_VERSION defines)
          for key in VERSION FIRMWARE_VERSION; do
            V=$(sed -n "s/.*-D ${key}='\"\([^\"]*\)\"'.*/\1/p" platformio.ini | head -1)
            check platformio.ini "-D $key" "$V"
          done

          # Embedded firmware version marker (tracked file read by the server at runtime).
          # Tolerates a build suffix ".N" (e.g. 11.1.0.14): only the X.Y.Z part is
          # compared to the tag; any other shape fails.
          F=server-go/assets/firmware/version.txt
          if [ -f "$F" ]; then
            FV="$(tr -d '[:space:]' < "$F")"
            if printf '%s' "$FV" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
              check "$F" "content (X.Y.Z part, build suffix ignored)" "$(printf '%s' "$FV" | cut -d. -f1-3)"
            else
              echo "::error file=$F::content '$FV' is not X.Y.Z or X.Y.Z.N (expected $VERSION[.N])"
              REPORT="$REPORT\n  - $F: '$FV' invalid format (expected $VERSION or $VERSION.N)"
              FAIL=1
            fi
          else
            echo "::error file=$F::File missing (expected version $VERSION)"
            REPORT="$REPORT\n  - $F: file missing"
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Version check failed for tag v$VERSION. Mismatches:"
            printf "$REPORT\n"
            echo "Bump the files above to $VERSION, commit, then re-create the tag."
            exit 1
          fi
          echo "All versioned files match tag v$VERSION"

  # ============================================
  # STAGE 2: Compiling (parallel builds)
  # ============================================
  compiling:
    name: 🔨 Compile ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: [checking, testing, compiling-firmware]

    strategy:
      matrix:
        include:
          - target: Windows
            goos: windows
            goarch: amd64
            suffix: windows-amd64.exe
          - target: Linux ARM64
            goos: linux
            goarch: arm64
            suffix: linux-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server-go/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: server-go/web
        run: npm ci

      - name: Build frontend
        working-directory: server-go/web
        run: npm run build

      - name: Copy dist for embedding
        run: |
          rm -rf server-go/cmd/server/dist
          cp -r server-go/web/dist server-go/cmd/server/dist

      - name: Download firmware artifact for embedding
        uses: actions/download-artifact@v4
        with:
          name: firmware-buzzclick
          path: firmware-artifact

      - name: Embed firmware into server assets
        run: |
          VERSION="${{ needs.checking.outputs.version }}"
          # Fail early (and clearly) if the expected firmware artifact is missing:
          # the cp below must not silently embed nothing.
          if [ ! -f "firmware-artifact/buzzclick-v$VERSION-merged.bin" ]; then
            echo "::error::firmware-artifact/buzzclick-v$VERSION-merged.bin not found"
            ls -l firmware-artifact/
            exit 1
          fi
          # buzzclick-latest.bin / buzzclick-merged.bin are gitignored build artifacts.
          # version.txt is tracked and NOT written here: the checking job verified it.
          cp firmware-artifact/buzzclick-v$VERSION-merged.bin server-go/assets/firmware/buzzclick-latest.bin
          # Also embed merged binary for USB flash of new/dead buzzers
          cp firmware-artifact/buzzclick-v$VERSION-merged.bin server-go/assets/firmware/buzzclick-merged.bin
          echo "✅ Merged firmware v$VERSION embedded (USB flash support)"
          echo "✅ Firmware v$VERSION embedded into server assets"

      - name: Install goversioninfo (Windows only)
        if: matrix.goos == 'windows'
        run: go install github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.4.1

      - name: Generate Windows PE metadata (Windows only)
        if: matrix.goos == 'windows'
        env:
          VERSION: ${{ needs.checking.outputs.version }}
        run: |
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "Generating versioninfo.json for v$VERSION..."
          jq -n \
            --argjson major "$MAJOR" \
            --argjson minor "$MINOR" \
            --argjson patch "$PATCH" \
            --arg version "$VERSION" \
            '{
              FixedFileInfo: {
                FileVersion:    {Major: $major, Minor: $minor, Patch: $patch, Build: 0},
                ProductVersion: {Major: $major, Minor: $minor, Patch: $patch, Build: 0},
                FileFlagsMask: "3f", FileFlags: "00",
                FileOS: "040004", FileType: "01", FileSubType: "00"
              },
              StringFileInfo: {
                Comments: "", CompanyName: "CCoupel",
                FileDescription: "Wireless Buzzer System for Quiz Games",
                FileVersion: "\($major).\($minor).\($patch).0",
                InternalName: "buzzcontrol",
                LegalCopyright: "2026 CCoupel", LegalTrademarks: "",
                OriginalFilename: "buzzcontrol.exe", PrivateBuild: "",
                ProductName: "BuzzControl", ProductVersion: $version,
                SpecialBuild: ""
              },
              VarFileInfo: {Translation: {LangID: "0409", CharsetID: "04B0"}},
              IconPath: "../../assets/icon.ico",
              ManifestPath: ""
            }' > server-go/cmd/server/versioninfo.json
          cd server-go/cmd/server && goversioninfo -o resource_windows_amd64.syso
          echo "Windows PE metadata generated (resource_windows_amd64.syso)"

      - name: Build ${{ matrix.target }}
        working-directory: server-go
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${{ needs.checking.outputs.version }}"
          echo "Building ${{ matrix.target }} with embedded version $VERSION..."
          go build -ldflags="-s -w -X main.Version=$VERSION" -o ../buzzcontrol-v$VERSION-${{ matrix.suffix }} ./cmd/server
          echo "✅ ${{ matrix.target }} build complete"

      - name: Validate binary
        run: |
          FILE="buzzcontrol-v${{ needs.checking.outputs.version }}-${{ matrix.suffix }}"
          SIZE=$(stat -c%s "$FILE")
          echo "${{ matrix.target }} binary: $SIZE bytes ($(numfmt --to=iec $SIZE))"

          MIN_SIZE=5242880
          if [ "$SIZE" -lt "$MIN_SIZE" ]; then
            echo "❌ ERROR: Binary too small ($SIZE < $MIN_SIZE)"
            exit 1
          fi
          echo "✅ ${{ matrix.target }} binary validation passed"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: buzzcontrol-v${{ needs.checking.outputs.version }}-${{ matrix.suffix }}
          retention-days: 1

  compiling-firmware:
    name: 🔨 Compile BuzzClick Firmware
    runs-on: ubuntu-latest
    needs: checking

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install --upgrade platformio
          pio --version

      - name: Build BuzzClick firmware
        run: |
          echo "Building BuzzClick firmware..."
          pio run -e buzzclick
          echo "✅ Firmware build complete"

      - name: Generate merged firmware binary
        run: |
          VERSION="${{ needs.checking.outputs.version }}"
          echo "Generating merged firmware binary (bootloader + partitions + boot_app0 + app)..."

          # Use esptool from PlatformIO packages
          ESPTOOL=$(find $HOME/.platformio/packages/tool-esptoolpy -name "esptool.py" 2>/dev/null | head -1)
          if [ -z "$ESPTOOL" ]; then
            ESPTOOL="python -m esptool"
          else
            ESPTOOL="python $ESPTOOL"
          fi

          # boot_app0.bin: standard Arduino-ESP32 file that initializes OTA data to boot from ota_0
          BOOT_APP0=$(find $HOME/.platformio/packages/framework-arduinoespressif32*/tools/partitions/boot_app0.bin 2>/dev/null | head -1)
          if [ -z "$BOOT_APP0" ]; then
            echo "❌ ERROR: boot_app0.bin not found in PlatformIO packages"
            exit 1
          fi

          $ESPTOOL --chip esp32c3 merge_bin \
            -o buzzclick-v$VERSION-merged.bin \
            0x0     .pio/build/buzzclick/bootloader.bin \
            0x8000  .pio/build/buzzclick/partitions.bin \
            0xe000  $BOOT_APP0 \
            0x10000 .pio/build/buzzclick/firmware.bin

          echo "✅ Merged binary: buzzclick-v$VERSION-merged.bin ($(numfmt --to=iec $(stat -c%s buzzclick-v$VERSION-merged.bin)))"

      - name: Validate firmware binary
        run: |
          VERSION="${{ needs.checking.outputs.version }}"
          # Validate the merged binary (contains bootloader + app, so larger than app-only)
          FILE="buzzclick-v$VERSION-merged.bin"
          SIZE=$(stat -c%s "$FILE")
          echo "Merged firmware binary: $SIZE bytes ($(numfmt --to=iec $SIZE))"

          MIN_SIZE=204800   # 200 KB
          MAX_SIZE=3145728  # 3 MB
          if [ "$SIZE" -lt "$MIN_SIZE" ]; then
            echo "❌ ERROR: Firmware too small ($SIZE < $MIN_SIZE)"
            exit 1
          fi
          if [ "$SIZE" -gt "$MAX_SIZE" ]; then
            echo "❌ ERROR: Firmware too large ($SIZE > $MAX_SIZE)"
            exit 1
          fi
          echo "✅ Firmware validation passed"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-buzzclick
          # The merged binary is the primary artifact: supports both USB flash and OTA.
          # The server auto-detects the format and extracts the app portion for OTA.
          path: buzzclick-v${{ needs.checking.outputs.version }}-merged.bin
          retention-days: 1

  # ============================================
  # STAGE 3: Releasing
  # ============================================
  releasing:
    name: 🚀 Releasing
    runs-on: ubuntu-latest
    needs: [checking, testing, compiling, compiling-firmware]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download server binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Download firmware
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: firmware-*
          merge-multiple: true

      - name: List artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -lh artifacts/

      - name: Generate SHA256SUMS
        working-directory: artifacts
        run: |
          rm -f SHA256SUMS
          sha256sum -- $(ls -1 | LC_ALL=C sort) > SHA256SUMS
          echo "SHA256SUMS:"
          cat SHA256SUMS

      - name: Generate release notes
        id: release_notes
        run: |
          VERSION="${{ needs.checking.outputs.version }}"

          echo "Extracting release notes for v$VERSION from CHANGELOG.md..."

          # Extract release notes from CHANGELOG.md
          NOTES=$(awk "/## \[$VERSION\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md)

          if [ -z "$NOTES" ]; then
            NOTES="Release v$VERSION"
            echo "⚠️ No release notes found in CHANGELOG.md, using default"
          else
            echo "✅ Release notes extracted"
          fi

          # Save to file for multiline support
          echo "$NOTES" > release_notes.md
          echo "--- Release Notes ---"
          cat release_notes.md
          echo "---------------------"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: BuzzControl v${{ needs.checking.outputs.version }}
          body_path: release_notes.md
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release summary
        run: |
          echo "=========================================="
          echo "🎉 Release v${{ needs.checking.outputs.version }} published!"
          echo ""
          echo "📦 Assets:"
          ls -1 artifacts/
          echo ""
          echo "🔗 https://github.com/${{ github.repository }}/releases/tag/v${{ needs.checking.outputs.version }}"
          echo "=========================================="
