# Généré par le template (/init-project) — NE PAS MODIFIER : réécrit à chaque passage.
# Ajouts propres au projet : .claude-launcher/env.yaml (fusionné par Claude-Launcher ≥ v5.5.0).
image: docker.io/library/debian:12
packages: [jq, python3]
packages_by_manager:
  apt: [build-essential, gh, python3-pip, python3-venv, xz-utils]
  dnf: [gcc, gcc-c++, gh, make, python3-pip, xz]
  apk: [build-base, github-cli, py3-pip, xz]
setup:
  - git config --global --get-all include.path | grep -qxF "$PWD/PRIVATE/gitconfig" || git config --global --add include.path "$PWD/PRIVATE/gitconfig"
  - |
    V=22.23.3; A=$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')
    [ "$(node -v 2>/dev/null)" = "v$V" ] || { mkdir -p ~/.local; curl -fsSL https://nodejs.org/dist/v$V/node-v$V-linux-$A.tar.xz | tar -xJ -C ~/.local --strip-components=1; }
  - |
    V=1.26.10; A=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
    [ "$(~/.local/go/bin/go env GOVERSION 2>/dev/null)" = "go$V" ] || { rm -rf ~/.local/go; mkdir -p ~/.local; curl -fsSL https://go.dev/dl/go$V.linux-$A.tar.gz | tar -xz -C ~/.local; }
    mkdir -p ~/.local/bin; ln -sf ~/.local/go/bin/go ~/.local/go/bin/gofmt ~/.local/bin/
  - |
    [ -x ~/.local/pio/bin/pio ] || { python3 -m venv ~/.local/pio && ~/.local/pio/bin/pip install -q platformio; }
    ln -sf ~/.local/pio/bin/pio ~/.local/pio/bin/platformio ~/.local/bin/
  - (cd server-go && go mod download)
  - (cd server-go/web && npm ci)
watch: [server-go/go.sum, server-go/web/package-lock.json]
local: [.pio, server-go/web/node_modules]
