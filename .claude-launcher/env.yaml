# Ajouts propres au projet — fusionnés par Claude-Launcher ≥ v5.5.0 après .claude-launcher/env-template.yaml
# (généré par le template, ne pas le modifier). Un projet ne peut pas retirer un élément du template.
image: docker.io/library/ubuntu:24.04
# packages: []
# Go du projet en avance sur le template (GO-2026-6859, corrigée en go1.26.11) : installé dans son propre
# dossier, puis lien ~/.local/bin/go repris après l'étape du template (qui garde ~/.local/go). Idempotent.
# À retirer quand env-template.yaml portera >= 1.26.11.
setup:
  - |
    V=1.26.11; A=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/'); D=~/.local/go$V
    [ "$($D/bin/go env GOVERSION 2>/dev/null)" = "go$V" ] || { rm -rf $D; mkdir -p $D; curl -fsSL https://go.dev/dl/go$V.linux-$A.tar.gz | tar -xz -C $D --strip-components=1; }
    mkdir -p ~/.local/bin; ln -sf $D/bin/go $D/bin/gofmt ~/.local/bin/
# prefer: podman
# mounts: []                # dossiers en plus, ex. [{ path: ../autre, ro: true }]
