# Ajouts propres au projet — fusionnés par Claude-Launcher ≥ v5.5.0 après .claude-launcher/env-template.yaml
# (généré par le template, ne pas le modifier). Un projet ne peut pas retirer un élément du template.
image: docker.io/library/ubuntu:26.04
# packages: []
# Go du projet en avance sur le template (GO-2026-6859, corrigée en go1.26.11) : installé dans son propre
# dossier, puis lien ~/.local/bin/go repris après l'étape du template (qui garde ~/.local/go). Idempotent.
# À retirer quand env-template.yaml portera >= 1.26.11.
setup:
  - |
    V=1.26.11; A=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/'); D=~/.local/go$V
    [ "$($D/bin/go env GOVERSION 2>/dev/null)" = "go$V" ] || { rm -rf $D; mkdir -p $D; curl -fsSL https://go.dev/dl/go$V.linux-$A.tar.gz | tar -xz -C $D --strip-components=1; }
    mkdir -p ~/.local/bin; ln -sf $D/bin/go $D/bin/gofmt ~/.local/bin/
  # govulncheck (commands.audit) : installé dans ~/go/bin (déjà dans le PATH de commands.env). Idempotent.
  - |
    export PATH=$HOME/.local/bin:$HOME/go/bin:$PATH GOTOOLCHAIN=go1.26.11
    command -v govulncheck >/dev/null 2>&1 || go install golang.org/x/vuln/cmd/govulncheck@latest
  # Capture d'écran de /tv pour le site marketing : Playwright + Chromium headless (le paquet chromium d'Ubuntu est un
  # snap, inutilisable en conteneur). Libs système via sudo, navigateur dans ~/.cache. Script : ~/.local/pw/shot.js. Idempotent.
  - |
    D=~/.local/pw; mkdir -p $D; cd $D
    [ -d node_modules/playwright ] || { npm init -y >/dev/null && npm i playwright; }
    ls ~/.cache/ms-playwright/chromium_headless_shell-* >/dev/null 2>&1 || { sudo -n env "PATH=$PATH" npx playwright install-deps chromium && npx playwright install chromium; }
    cat > shot.js <<'EOF'
    const { chromium } = require('playwright');
    (async () => {
      const [url, out, w = 1920, h = 1080] = process.argv.slice(2);
      const b = await chromium.launch();
      const p = await b.newPage({ viewport: { width: +w, height: +h } });
      await p.goto(url, { waitUntil: 'networkidle' });
      await p.screenshot({ path: out });
      await b.close();
    })();
    EOF
# prefer: podman
# mounts: []                # dossiers en plus, ex. [{ path: ../autre, ro: true }]
